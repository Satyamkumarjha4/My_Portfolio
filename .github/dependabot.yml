version: 2

# Every semver-major bump is ignored on purpose. Each one is a planned migration, not a
# one-click merge, and many are coupled to other packages: a lone @eslint/js 10 needs
# eslint 10, TypeScript 7 is outside typescript-eslint's supported range (<6.1), Prisma 7
# needs a migration, and so on. A bump that cannot install also fails the Vercel preview
# build for its branch. Minor and patch updates still arrive, grouped to cut the noise.
#
# To take a major deliberately, do it by hand in one PR (the ESLint family, TypeScript +
# typescript-eslint and the Prisma pair must move together), or temporarily remove the rule.
updates:
  - package-ecosystem: npm
    directory: /Backend
    schedule:
      interval: weekly
    groups:
      eslint:
        patterns: ["eslint", "@eslint/*", "globals"]
      prisma:
        patterns: ["prisma", "@prisma/*"]
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: npm
    directory: /Frontend
    schedule:
      interval: weekly
    groups:
      eslint:
        patterns: ["eslint", "@eslint/*", "eslint-plugin-*", "typescript-eslint", "globals"]
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
      # 0.x packages treat a minor as breaking: 0.4 -> 0.5 needs eslint 9+/10 and config changes.
      - dependency-name: "eslint-plugin-react-refresh"
        update-types: ["version-update:semver-minor"]
      - dependency-name: "lucide-react"
        update-types: ["version-update:semver-minor"]

  # Not ignored: Action majors are usually safe, but read the release notes before merging.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
