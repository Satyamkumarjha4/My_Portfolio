version: 2

# Major-version bumps are ignored here on purpose: each one is a planned migration, not a
# one-click merge, and a lone bump of one half of a coupled pair (e.g. @eslint/js 10 without
# eslint 10) cannot even install. Minor and patch updates still arrive. When you decide to take
# a major, remove its entry below (the ESLint family and the Prisma pair must move together).
#
# - eslint family: eslint, @eslint/js, globals, eslint-plugin-react-refresh (+ react-hooks, typescript-eslint)
# - Prisma 7: needs a migration; drop the deepmerge-ts override in Backend/package.json with it
# - @vitejs/plugin-react 6, dotenv 18: not needed yet
updates:
  - package-ecosystem: npm
    directory: /Backend
    schedule:
      interval: weekly
    groups:
      eslint:
        patterns: ["eslint", "@eslint/*", "globals"]
      prisma:
        patterns: ["prisma", "@prisma/*"]
    ignore:
      - dependency-name: "eslint"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@eslint/js"
        update-types: ["version-update:semver-major"]
      - dependency-name: "globals"
        update-types: ["version-update:semver-major"]
      - dependency-name: "prisma"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@prisma/client"
        update-types: ["version-update:semver-major"]
      - dependency-name: "dotenv"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: npm
    directory: /Frontend
    schedule:
      interval: weekly
    groups:
      eslint:
        patterns: ["eslint", "@eslint/*", "eslint-plugin-*", "typescript-eslint", "globals"]
    ignore:
      - dependency-name: "eslint"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@eslint/js"
        update-types: ["version-update:semver-major"]
      - dependency-name: "globals"
        update-types: ["version-update:semver-major"]
      - dependency-name: "eslint-plugin-react-hooks"
        update-types: ["version-update:semver-major"]
      - dependency-name: "eslint-plugin-react-refresh"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
      - dependency-name: "@vitejs/plugin-react"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
