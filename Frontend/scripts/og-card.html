<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>OG card</title>
    <!-- Source for public/og-image.png (1200x630). Re-render with Playwright:
         page.setViewportSize({width:1200,height:630}); page.goto(file); page.screenshot({path:'public/og-image.png'}) -->
    <style>
      * { box-sizing: border-box; margin: 0; }
      html, body { width: 1200px; height: 630px; }
      body {
        font-family: "Inter", "Segoe UI", system-ui, -apple-system, "Helvetica Neue", Arial, sans-serif;
        color: #fff;
        background: radial-gradient(circle at 85% 15%, rgba(99, 102, 241, 0.35), transparent 55%), #111827;
        display: flex; flex-direction: column; justify-content: center;
        padding: 0 96px; position: relative; overflow: hidden;
      }
      .bar { position: absolute; left: 0; top: 0; bottom: 0; width: 14px; background: #6366f1; }
      .hello { font-size: 34px; color: #9ca3af; margin-bottom: 18px; }
      h1 { font-size: 104px; line-height: 1.05; font-weight: 800; letter-spacing: -2px; }
      h1 span { color: #818cf8; }
      .role { margin-top: 28px; font-size: 48px; font-weight: 600; color: #e5e7eb; }
      .stack { margin-top: 18px; font-size: 30px; color: #9ca3af; }
    </style>
  </head>
  <body>
    <div class="bar"></div>
    <div class="hello">Hi, I'm</div>
    <h1>Satyam <span>Kumar Jha</span></h1>
    <div class="role">Full-Stack &amp; AI/ML Developer</div>
    <div class="stack">React · Express · PostgreSQL · Python</div>
  </body>
</html>
